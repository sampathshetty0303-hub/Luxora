<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LUXORA - Checkout</title>

<link
    rel="stylesheet"
    href="/css/style.css"
>

<style>
    .checkout-container {
        max-width: 700px;
        margin: 60px auto;
        padding: 40px;
        background: #fff;
        border: 1px solid #e3ddd2;
    }

    .checkout-container h1 {
        font-family: Georgia, serif;
        font-weight: normal;
        font-size: 42px;
        margin-bottom: 10px;
    }

    .checkout-container > p {
        color: #777;
        margin-bottom: 35px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: bold;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 14px;
        border: 1px solid #ccc;
        background: #fafafa;
        font-size: 15px;
        outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus {
        border-color: #d4af37;
    }

    .form-group textarea {
        min-height: 100px;
        resize: vertical;
    }

    #orderSummary {
        margin: 30px 0;
        padding: 20px;
        background: #faf8f3;
        border: 1px solid #e3ddd2;
    }

    .summary-title {
        font-family: Georgia, serif;
        font-size: 22px;
        margin-bottom: 15px;
    }

    .summary-item {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #ddd;
    }

    .summary-total {
        display: flex;
        justify-content: space-between;
        margin-top: 15px;
        font-weight: bold;
        font-size: 18px;
    }

    .checkout-button {
        width: 100%;
        padding: 17px;
        background: #d4af37;
        border: none;
        color: #111;
        font-weight: bold;
        cursor: pointer;
        font-size: 14px;
    }

    .checkout-button:hover {
        background: #b9972e;
    }

    .checkout-button:disabled {
        opacity: .6;
        cursor: not-allowed;
    }

    #checkoutMessage {
        margin-top: 20px;
        text-align: center;
        padding: 15px;
        display: none;
    }

    #checkoutMessage.success {
        display: block;
        color: #246b35;
        background: #edf8ef;
        border: 1px solid #9bd0a6;
    }

    #checkoutMessage.error {
        display: block;
        color: #9b2525;
        background: #fff0f0;
        border: 1px solid #e0a0a0;
    }

    .success-screen {
        display: none;
        text-align: center;
        padding: 30px 10px;
    }

    .success-icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 25px;
        border: 2px solid #d4af37;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #d4af37;
        font-size: 38px;
    }

    .success-screen h2 {
        font-family: Georgia, serif;
        font-size: 38px;
        font-weight: normal;
        margin-bottom: 15px;
    }

    .success-screen p {
        color: #777;
        line-height: 1.7;
    }

    .order-number {
        margin: 20px 0;
        font-weight: bold;
    }

    .continue-shopping {
        display: inline-block;
        margin-top: 25px;
        padding: 15px 25px;
        background: #d4af37;
        color: #111;
        text-decoration: none;
        font-weight: bold;
    }

    @media(max-width:600px) {
        .checkout-container {
            margin: 20px;
            padding: 25px;
        }

        .checkout-container h1 {
            font-size: 32px;
        }
    }
</style>
```

</head>

<div id="checkoutContent">

    <h1>Complete Your Order</h1>

    <p>

    <form id="checkoutForm">

        <div class="form-group">

        <div class="form-group">

            <label>
                Email

            </label>

            <input
                type="email"
                id="email"
            >

        </div>


        <div class="form-group">

            <label>
                Address
            </label>

            <textarea
                id="address"
                required
            ></textarea>

        </div>


        <div class="form-group">

            <label>
                City
            </label>

            <input
                type="text"
                id="city"
                required
            >

        </div>


        <div class="form-group">

</main>

<script>

const cart =
    JSON.parse(
        localStorage.getItem("luxoraCart")
    ) || [];


const products = [

    {
        id: 1,
        name: "LUXORA Noir",
        price: 2499
    },

    {
        id: 2,
        name: "LUXORA Élan",
        price: 2299
    },

    {
        id: 3,
        name: "LUXORA Oud",
        price: 2799
    },

    {
        id: 4,
        name: "LUXORA Éclat",
        price: 2199
    }

];


function money(value) {

    return "₹" +
        Number(value)
        .toLocaleString("en-IN");

}


function displayOrderSummary() {

    const summary =
        document.getElementById(
            "orderSummary"
        );


    if (cart.length === 0) {

        summary.innerHTML = `
            <div class="summary-title">
                Your Bag
            </div>

            <p>Your bag is empty.</p>
        `;

        return;
    }


    let total = 0;

    let html = `
        <div class="summary-title">
            Your Order
        </div>
    `;


    cart.forEach(item => {

        const product =
            products.find(
                p => p.id === item.id
            );


        if (!product) return;


        const itemTotal =
            product.price *
            item.quantity;


        total += itemTotal;


        html += `
            <div class="summary-item">
                <span>
                    ${product.name}
                    × ${item.quantity}
                </span>

                <span>
                    ${money(itemTotal)}
                </span>
            </div>
        `;

    });


    html += `
        <div class="summary-total">
            <span>Total</span>
            <span>${money(total)}</span>
        </div>
    `;


    summary.innerHTML = html;

}


document
    .getElementById("checkoutForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            if (cart.length === 0) {

                showMessage(
                    "Your bag is empty.",
                    "error"
                );

                return;

            }


            const button =
                document.getElementById(
                    "placeOrderButton"
                );


            button.disabled = true;

            button.innerText =
                "PLACING ORDER...";


            const orderData = {

                name:
                    document
                    .getElementById("name")
                    .value
                    .trim(),

                phone:
                    document
                    .getElementById("phone")
                    .value
                    .trim(),

                email:
                    document
                    .getElementById("email")
                    .value
                    .trim(),

                address:
                    document
                    .getElementById("address")
                    .value
                    .trim(),

                city:
                    document
                    .getElementById("city")
                    .value
                    .trim(),

                state:
                    document
                    .getElementById("state")
                    .value
                    .trim(),

                pinCode:
                    document
                    .getElementById("pinCode")
                    .value
                    .trim(),

                items: cart

            };


            try {

                const response =
                    await fetch(
                        "/api/orders",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials: "include",

                            body:
                                JSON.stringify(
                                    orderData
                                )

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Could not place order"
                    );

                }


                /*
                 * ORDER SUCCESS
                 */

                document
                    .getElementById(
                        "checkoutContent"
                    )
                    .style.display =
                    "none";


                document
                    .getElementById(
                        "successScreen"
                    )
                    .style.display =
                    "block";


                document
                    .getElementById(
                        "orderNumber"
                    )
                    .innerText =
                    data.orderNumber
                    ? "Order ID: " +
                      data.orderNumber
                    : "Your order has been confirmed.";


                /*
                 * Clear cart only
                 * after backend confirms order
                 */

                localStorage.removeItem(
                    "luxoraCart"
                );


            } catch(error) {

                console.error(error);


                showMessage(
                    error.message ||
                    "Something went wrong. Please try again.",
                    "error"
                );


                button.disabled =
                    false;

                button.innerText =
                    "PLACE ORDER";

            }

        }
    );


function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "checkoutMessage"
        );


    message.innerText =
        text;

    message.className =
        type;

}


displayOrderSummary();

</script>

</body>

</html>

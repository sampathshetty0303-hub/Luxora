<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LUXORA | Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    rgba(0,0,0,.8),
                    rgba(0,0,0,.8)
                ),
                url("https://images.unsplash.com/photo-1547887538-e3a2f32cb1cc?auto=format&fit=crop&w=2000&q=90");

            background-size: cover;

            background-position: center;

            display: flex;

            align-items: center;

            justify-content: center;

            color: white;
        }

        .container {

            width: 430px;

            max-width: 92%;

            background: #0b0b0b;

            border:
                1px solid
                rgba(212,175,55,.4);

            padding: 45px;
        }

        .logo {

            text-align: center;

            color: #d4af37;

            font-family: Georgia, serif;

            font-size: 38px;

            letter-spacing: 7px;
        }

        .subtitle {

            text-align: center;

            color: #888;

            font-size: 11px;

            letter-spacing: 2px;

            margin:
                8px 0 35px;
        }

        .group {

            margin-bottom: 20px;
        }

        label {

            display: block;

            font-size: 11px;

            letter-spacing: 1px;

            color: #ddd;

            margin-bottom: 8px;
        }

        input {

            width: 100%;

            padding: 14px;

            background: #151515;

            border: 1px solid #444;

            color: white;

            outline: none;
        }

        input:focus {

            border-color: #d4af37;
        }

        button {

            width: 100%;

            padding: 15px;

            background: #d4af37;

            border: 0;

            color: #111;

            font-weight: bold;

            cursor: pointer;
        }

        button:disabled {

            opacity: .6;

            cursor: not-allowed;
        }

        #otpSection {

            display: none;
        }

        .otp-info {

            color: #999;

            font-size: 12px;

            text-align: center;

            line-height: 1.7;

            margin-bottom: 20px;
        }

        .email-highlight {

            color: #d4af37;
        }

        .otp {

            text-align: center;

            font-size: 25px;

            letter-spacing: 8px;
        }

        .message {

            display: none;

            padding: 12px;

            margin-bottom: 20px;

            font-size: 12px;

            text-align: center;
        }

        .message.error {

            display: block;

            color: #ff9999;

            background: #250f0f;

            border: 1px solid #8d3333;
        }

        .message.success {

            display: block;

            color: #8ee79b;

            background: #102315;

            border: 1px solid #397a46;
        }

        .register {

            text-align: center;

            color: #777;

            margin-top: 25px;

            font-size: 13px;
        }

        .register a {

            color: #d4af37;

            text-decoration: none;
        }

        .back {

            display: block;

            text-align: center;

            color: #666;

            text-decoration: none;

            font-size: 11px;

            margin-top: 20px;
        }

        .resend {

            text-align: center;

            color: #777;

            font-size: 12px;

            margin-top: 20px;
        }

        .resend button {

            width: auto;

            padding: 0;

            background: none;

            color: #d4af37;
        }

        .resend button:disabled {

            color: #555;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="logo">
        LUXORA
    </div>

    <div class="subtitle">
        MEMBER LOGIN
    </div>


    <div
        class="message"
        id="message"
    ></div>


    <div id="emailSection">

        <form id="loginForm">

            <div class="group">

                <label>
                    EMAIL ADDRESS
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Your email address"
                    required
                >

            </div>


            <button
                id="sendButton"
                type="submit"
            >
                SEND LOGIN OTP
            </button>

        </form>


        <div class="register">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </div>

    </div>


    <div id="otpSection">

        <div class="otp-info">

            We sent a login code to

            <br>

            <span
                class="email-highlight"
                id="otpEmail"
            ></span>

        </div>


        <form id="otpForm">

            <div class="group">

                <label>
                    LOGIN OTP
                </label>

                <input
                    id="otp"
                    class="otp"
                    type="text"
                    maxlength="6"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    placeholder="000000"
                    required
                >

            </div>


            <button
                id="verifyButton"
                type="submit"
            >
                LOGIN
            </button>

        </form>


        <div class="resend">

            Didn't receive it?

            <button
                id="resendButton"
                type="button"
                onclick="resendOTP()"
                disabled
            >
                Resend OTP
            </button>

            <span id="timer"></span>

        </div>

    </div>


    <a
        href="index.html"
        class="back"
    >
        ← Back to LUXORA
    </a>

</div>


<script>

let timer;


const message =
    document.getElementById("message");


function showMessage(text, type) {

    message.innerText = text;

    message.className =
        "message " + type;
}


// =====================================================
// SEND LOGIN OTP
// =====================================================

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async event => {

            event.preventDefault();

            const email =
                document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();

            const button =
                document.getElementById(
                    "sendButton"
                );

            button.disabled = true;

            button.innerText =
                "SENDING...";


            try {

                const response =
                    await fetch(
                        "/api/auth/login/send-otp",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials: "include",

                            body: JSON.stringify({
                                email
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Could not send login OTP"
                    );
                }


                document
                    .getElementById("otpEmail")
                    .innerText = email;


                document
                    .getElementById(
                        "emailSection"
                    )
                    .style.display = "none";


                document
                    .getElementById(
                        "otpSection"
                    )
                    .style.display = "block";


                showMessage(
                    "Login OTP sent.",
                    "success"
                );


                startTimer();


                document
                    .getElementById("otp")
                    .focus();


            } catch (error) {

                console.error(error);

                showMessage(
                    error.message,
                    "error"
                );

            }


            button.disabled = false;

            button.innerText =
                "SEND LOGIN OTP";

        }
    );


// =====================================================
// VERIFY LOGIN OTP
// =====================================================

document
    .getElementById("otpForm")
    .addEventListener(
        "submit",
        async event => {

            event.preventDefault();

            const email =
                document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();

            const otp =
                document
                .getElementById("otp")
                .value
                .trim();

            const button =
                document.getElementById(
                    "verifyButton"
                );


            if (!/^\d{6}$/.test(otp)) {

                showMessage(
                    "Enter the 6-digit OTP.",
                    "error"
                );

                return;
            }


            button.disabled = true;

            button.innerText =
                "VERIFYING...";


            try {

                const response =
                    await fetch(
                        "/api/auth/login/verify",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials: "include",

                            body: JSON.stringify({
                                email,
                                otp
                            })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "OTP verification failed"
                    );
                }


                clearInterval(timer);

                showMessage(
                    "Login successful.",
                    "success"
                );


                setTimeout(
                    () => {
                        window.location.href =
                            "index.html";
                    },
                    500
                );


            } catch (error) {

                console.error(error);

                showMessage(
                    error.message,
                    "error"
                );

            }


            button.disabled = false;

            button.innerText =
                "LOGIN";

        }
    );


// =====================================================
// RESEND LOGIN OTP
// =====================================================

async function resendOTP() {

    const button =
        document.getElementById(
            "resendButton"
        );

    button.disabled = true;


    try {

        const response =
            await fetch(
                "/api/auth/login/resend",
                {
                    method: "POST",

                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Could not resend OTP"
            );
        }


        showMessage(
            "New OTP sent.",
            "success"
        );


        startTimer();


    } catch (error) {

        showMessage(
            error.message,
            "error"
        );

        button.disabled = false;
    }
}


// =====================================================
// TIMER
// =====================================================

function startTimer() {

    let seconds = 30;

    const button =
        document.getElementById(
            "resendButton"
        );

    const timerText =
        document.getElementById(
            "timer"
        );

    clearInterval(timer);

    button.disabled = true;

    timerText.innerText =
        ` (${seconds}s)`;


    timer =
        setInterval(
            () => {

                seconds--;

                timerText.innerText =
                    ` (${seconds}s)`;


                if (seconds <= 0) {

                    clearInterval(timer);

                    button.disabled = false;

                    timerText.innerText = "";
                }

            },
            1000
        );
}

</script>

</body>

</html>

</div>

<script>

let timer = null;

let currentEmail = "";


const message =
    document.getElementById("message");


/*
====================================================
MESSAGE
====================================================
*/

function showMessage(text, type) {

    message.innerText = text;

    message.className =
        "message " + type;

}


/*
====================================================
SEND LOGIN OTP
====================================================
*/

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();


            if (!email) {

                showMessage(
                    "Please enter your email address.",
                    "error"
                );

                return;
            }


            currentEmail = email;


            const button =
                document.getElementById(
                    "sendButton"
                );


            button.disabled = true;

            button.innerText =
                "SENDING...";


            try {

                const response =
                    await fetch(
                        "/api/auth/login/send-otp",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials: "include",

                            body:
                                JSON.stringify({
                                    email: email
                                })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Unable to send login OTP."
                    );

                }


                document
                    .getElementById("otpEmail")
                    .innerText = email;


                document
                    .getElementById("emailSection")
                    .style.display = "none";


                document
                    .getElementById("otpSection")
                    .style.display = "block";


                showMessage(
                    "Login OTP sent to your email.",
                    "success"
                );


                startTimer();


                document
                    .getElementById("otp")
                    .focus();


            } catch (error) {

                console.error(
                    "SEND LOGIN OTP ERROR:",
                    error
                );


                showMessage(
                    error.message ||
                    "Unable to connect to the server.",
                    "error"
                );

            }


            button.disabled = false;

            button.innerText =
                "SEND LOGIN OTP";

        }
    );


/*
====================================================
VERIFY LOGIN OTP
====================================================
*/

document
    .getElementById("otpForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const otp =
                document
                    .getElementById("otp")
                    .value
                    .trim();


            if (!/^[0-9]{6}$/.test(otp)) {

                showMessage(
                    "Please enter the 6-digit OTP.",
                    "error"
                );

                return;
            }


            if (!currentEmail) {

                showMessage(
                    "Please request a new login OTP.",
                    "error"
                );

                return;
            }


            const button =
                document.getElementById(
                    "verifyButton"
                );


            button.disabled = true;

            button.innerText =
                "VERIFYING...";


            try {

                const response =
                    await fetch(
                        "/api/auth/login/verify",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials: "include",

                            body:
                                JSON.stringify({
                                    email: currentEmail,
                                    otp: otp
                                })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Invalid OTP."
                    );

                }


                /*
                Save user locally for frontend
                convenience.

                Authentication itself should
                remain controlled by the server.
                */

                if (data.user) {

                    localStorage.setItem(
                        "luxoraUser",
                        JSON.stringify(
                            data.user
                        )
                    );

                }


                showMessage(
                    "Login successful. Redirecting...",
                    "success"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "index.html";

                    },
                    700
                );


            } catch (error) {

                console.error(
                    "VERIFY OTP ERROR:",
                    error
                );


                showMessage(
                    error.message ||
                    "Unable to verify OTP.",
                    "error"
                );


                button.disabled = false;

                button.innerText =
                    "LOGIN";

            }

        }
    );


/*
====================================================
RESEND OTP
====================================================
*/

async function resendOTP() {

    if (!currentEmail) {

        showMessage(
            "Please enter your email address again.",
            "error"
        );

        return;

    }


    const button =
        document.getElementById(
            "resendButton"
        );


    button.disabled = true;


    try {

        const response =
            await fetch(
                "/api/auth/login/resend",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "include",

                    body:
                        JSON.stringify({
                            email: currentEmail
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to resend OTP."
            );

        }


        showMessage(
            "A new OTP has been sent.",
            "success"
        );


        document
            .getElementById("otp")
            .value = "";


        document
            .getElementById("otp")
            .focus();


        startTimer();


    } catch (error) {

        console.error(
            "RESEND OTP ERROR:",
            error
        );


        showMessage(
            error.message ||
            "Unable to resend OTP.",
            "error"
        );


        button.disabled = false;

    }

}


/*
====================================================
CHANGE EMAIL
====================================================
*/

function changeEmail() {

    clearInterval(timer);


    currentEmail = "";


    document
        .getElementById("otp")
        .value = "";


    document
        .getElementById("otpSection")
        .style.display = "none";


    document
        .getElementById("emailSection")
        .style.display = "block";


    document
        .getElementById("email")
        .focus();


    document
        .getElementById("timer")
        .innerText = "";


    document
        .getElementById("resendButton")
        .disabled = true;

}


/*
====================================================
30 SECOND RESEND TIMER
====================================================
*/

function startTimer() {

    let seconds = 30;


    const button =
        document.getElementById(
            "resendButton"
        );


    const timerText =
        document.getElementById(
            "timer"
        );


    clearInterval(timer);


    button.disabled = true;


    timerText.innerText =
        ` (${seconds}s)`;


    timer =
        setInterval(
            function() {

                seconds--;


                timerText.innerText =
                    ` (${seconds}s)`;


                if (seconds <= 0) {

                    clearInterval(timer);


                    button.disabled =
                        false;


                    timerText.innerText =
                        "";

                }

            },
            1000
        );

}

</script>

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<title>LUXORA | Create Account</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    font-family:Arial,Helvetica,sans-serif;

    background:
    linear-gradient(
        rgba(0,0,0,.78),
        rgba(0,0,0,.78)
    ),
    url("https://images.unsplash.com/photo-1547887538-e3a2f32cb1cc?auto=format&fit=crop&w=2000&q=90");

    background-size:cover;
    background-position:center;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

}

.container{

    width:450px;
    max-width:92%;

    background:#0b0b0b;

    border:1px solid rgba(212,175,55,.4);

    padding:42px;

}

.logo{

    text-align:center;

    font-family:Georgia,serif;

    font-size:36px;

    letter-spacing:7px;

    color:#d4af37;

}

.subtitle{

    text-align:center;

    color:#888;

    font-size:11px;

    letter-spacing:2px;

    margin:8px 0 30px;

}

.steps{

    display:flex;
    justify-content:center;
    align-items:center;

    margin-bottom:30px;

}

.step{

    width:30px;
    height:30px;

    border:1px solid #555;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#777;

    font-size:12px;

}

.step.active{

    background:#d4af37;

    color:#111;

    border-color:#d4af37;

}

.line{

    width:45px;
    height:1px;

    background:#444;

}

.group{
    margin-bottom:20px;
}

label{

    display:block;

    color:#ddd;

    font-size:11px;

    letter-spacing:1px;

    margin-bottom:8px;

}

input{

    width:100%;

    padding:14px;

    background:#151515;

    border:1px solid #444;

    color:white;

    outline:none;

}

input:focus{
    border-color:#d4af37;
}

button.primary{

    width:100%;

    padding:15px;

    border:0;

    background:#d4af37;

    color:#111;

    font-weight:bold;

    cursor:pointer;

}

button.primary:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#otpSection{
    display:none;
}

.otp-info{

    text-align:center;

    color:#999;

    font-size:12px;

    line-height:1.7;

    margin-bottom:20px;

}

.otp-email{
    color:#d4af37;
}

.otp{

    text-align:center;

    font-size:25px;

    letter-spacing:8px;

}

.message{

    display:none;

    padding:12px;

    margin-bottom:20px;

    text-align:center;

    font-size:12px;

}

.message.error{

    display:block;

    background:#250f0f;

    border:1px solid #8d3333;

    color:#ff9999;

}

.message.success{

    display:block;

    background:#102315;

    border:1px solid #397a46;

    color:#8ee79b;

}

.resend{

    text-align:center;

    margin-top:20px;

    color:#777;

    font-size:12px;

}

.resend button{

    background:none;

    border:0;

    color:#d4af37;

    cursor:pointer;

    width:auto;

    padding:0;

}

.resend button:disabled{
    color:#555;
    cursor:not-allowed;
}

.login{

    text-align:center;

    margin-top:25px;

    color:#777;

    font-size:13px;

}

.login a{

    color:#d4af37;

    text-decoration:none;

}

.back{

    display:block;

    text-align:center;

    margin-top:20px;

    color:#666;

    font-size:11px;

    text-decoration:none;

}

.change-email{

    width:auto !important;

    padding:0 !important;

    margin-top:18px;

    background:none !important;

    color:#888 !important;

    font-weight:normal !important;

}

.change-email:hover{
    color:#d4af37 !important;
}

.success-screen{
    display:none;
    text-align:center;
}

.success-icon{

    width:65px;
    height:65px;

    border:2px solid #d4af37;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#d4af37;

    font-size:28px;

    margin:0 auto 20px;

}

.success-screen h2{

    font-family:Georgia,serif;

    font-weight:normal;

    margin-bottom:15px;

}

.success-screen p{

    color:#888;

    font-size:13px;

    line-height:1.7;

}

.shop{

    display:block;

    background:#d4af37;

    color:#111;

    text-decoration:none;

    padding:15px;

    margin-top:25px;

    font-weight:bold;

}

</style>

</head>

<body>

<div class="container">

```
<div class="logo">
    LUXORA
</div>

<div class="subtitle">
    CREATE YOUR ACCOUNT
</div>


<div class="steps">

    <div
        class="step active"
        id="step1"
    >
        1
    </div>

    <div class="line"></div>

    <div
        class="step"
        id="step2"
    >
        2
    </div>

</div>


<div
    class="message"
    id="message"
></div>


<!-- REGISTRATION -->

<div id="registrationSection">

    <form id="registerForm">

        <div class="group">

            <label for="name">
                FULL NAME
            </label>

            <input
                id="name"
                type="text"
                placeholder="Your full name"
                autocomplete="name"
                required
            >

        </div>


        <div class="group">

            <label for="email">
                EMAIL ADDRESS
            </label>

            <input
                id="email"
                type="email"
                placeholder="Your email address"
                autocomplete="email"
                required
            >

        </div>


        <button
            class="primary"
            id="sendButton"
            type="submit"
        >
            SEND VERIFICATION CODE
        </button>

    </form>


    <div class="login">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>


    <a
        href="index.html"
        class="back"
    >
        ← Back to LUXORA
    </a>

</div>


<!-- OTP -->

<div id="otpSection">

    <div class="otp-info">

        We sent a verification code to

        <br>

        <span
            class="otp-email"
            id="otpEmail"
        ></span>

    </div>


    <form id="otpForm">

        <div class="group">

            <label for="otp">
                6-DIGIT OTP
            </label>

            <input
                id="otp"
                class="otp"
                type="text"
                maxlength="6"
                inputmode="numeric"
                autocomplete="one-time-code"
                placeholder="000000"
                pattern="[0-9]{6}"
                required
            >

        </div>


        <button
            class="primary"
            id="verifyButton"
            type="submit"
        >
            VERIFY & CREATE ACCOUNT
        </button>

    </form>


    <div class="resend">

        Didn't receive it?

        <button
            id="resendButton"
            type="button"
            onclick="resendOTP()"
            disabled
        >
            Resend OTP
        </button>

        <span id="timer"></span>

    </div>


    <div class="login">

        Wrong email?

        <button
            class="change-email"
            type="button"
            onclick="changeEmail()"
        >
            Change
        </button>

    </div>

</div>


<!-- SUCCESS -->

<div
    class="success-screen"
    id="successScreen"
>

    <div class="success-icon">
        ✓
    </div>

    <h2>
        Welcome to LUXORA
    </h2>

    <p>
        Your account has been created
        and you are now logged in.
    </p>

    <a
        href="index.html"
        class="shop"
    >
        ENTER LUXORA
    </a>

</div>
```

</div>

<script>

let timer = null;

let currentName = "";

let currentEmail = "";


const message =
    document.getElementById("message");


/*
====================================================
MESSAGE
====================================================
*/

function showMessage(text, type){

    message.innerText = text;

    message.className =
        "message " + type;

}


/*
====================================================
SEND REGISTRATION OTP
====================================================
*/

document
    .getElementById("registerForm")
    .addEventListener(
        "submit",
        async function(event){

            event.preventDefault();


            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();


            if(!name){

                showMessage(
                    "Please enter your full name.",
                    "error"
                );

                return;

            }


            if(!email){

                showMessage(
                    "Please enter your email address.",
                    "error"
                );

                return;

            }


            currentName = name;

            currentEmail = email;


            const button =
                document.getElementById(
                    "sendButton"
                );


            button.disabled = true;

            button.innerText =
                "SENDING...";


            try{

                const response =
                    await fetch(
                        "/api/auth/register/send-otp",
                        {

                            method:"POST",

                            headers:{
                                "Content-Type":
                                    "application/json"
                            },

                            credentials:"include",

                            body:
                                JSON.stringify({
                                    name,
                                    email
                                })

                        }
                    );


                const data =
                    await response.json();


                if(!response.ok){

                    throw new Error(
                        data.message ||
                        "Unable to send verification code."
                    );

                }


                document
                    .getElementById("otpEmail")
                    .innerText =
                    email;


                document
                    .getElementById(
                        "registrationSection"
                    )
                    .style.display =
                    "none";


                document
                    .getElementById(
                        "otpSection"
                    )
                    .style.display =
                    "block";


                document
                    .getElementById("step1")
                    .classList.remove(
                        "active"
                    );


                document
                    .getElementById("step2")
                    .classList.add(
                        "active"
                    );


                showMessage(
                    "Verification OTP sent to your email.",
                    "success"
                );


                startTimer();


                document
                    .getElementById("otp")
                    .focus();


            }catch(error){

                console.error(
                    "REGISTER SEND OTP ERROR:",
                    error
                );


                showMessage(
                    error.message ||
                    "Unable to connect to the server.",
                    "error"
                );

            }


            button.disabled = false;

            button.innerText =
                "SEND VERIFICATION CODE";

        }
    );


/*
====================================================
VERIFY REGISTRATION OTP
====================================================
*/

document
    .getElementById("otpForm")
    .addEventListener(
        "submit",
        async function(event){

            event.preventDefault();


            const otp =
                document
                    .getElementById("otp")
                    .value
                    .trim();


            if(!/^[0-9]{6}$/.test(otp)){

                showMessage(
                    "Enter the 6-digit OTP.",
                    "error"
                );

                return;

            }


            if(!currentName || !currentEmail){

                showMessage(
                    "Registration session expired. Please start again.",
                    "error"
                );

                return;

            }


            const button =
                document.getElementById(
                    "verifyButton"
                );


            button.disabled = true;

            button.innerText =
                "VERIFYING...";


            try{

                const response =
                    await fetch(
                        "/api/auth/register/verify",
                        {

                            method:"POST",

                            headers:{
                                "Content-Type":
                                    "application/json"
                            },

                            credentials:"include",

                            body:
                                JSON.stringify({
                                    name:currentName,
                                    email:currentEmail,
                                    otp
                                })

                        }
                    );


                const data =
                    await response.json();


                if(!response.ok){

                    throw new Error(
                        data.message ||
                        "Invalid OTP."
                    );

                }


                clearInterval(timer);


                /*
                Store the returned user locally
                for frontend display.

                The real authentication session
                should be created by the backend.
                */

                if(data.user){

                    localStorage.setItem(
                        "luxoraUser",
                        JSON.stringify(
                            data.user
                        )
                    );

                }


                document
                    .getElementById(
                        "otpSection"
                    )
                    .style.display =
                    "none";


                message.style.display =
                    "none";


                document
                    .getElementById(
                        "successScreen"
                    )
                    .style.display =
                    "block";


            }catch(error){

                console.error(
                    "REGISTER VERIFY ERROR:",
                    error
                );


                showMessage(
                    error.message ||
                    "Unable to verify OTP.",
                    "error"
                );


                button.disabled = false;

                button.innerText =
                    "VERIFY & CREATE ACCOUNT";

            }

        }
    );


/*
====================================================
RESEND REGISTRATION OTP
====================================================
*/

async function resendOTP(){

    if(!currentName || !currentEmail){

        showMessage(
            "Please start registration again.",
            "error"
        );

        return;

    }


    const button =
        document.getElementById(
            "resendButton"
        );


    button.disabled = true;


    try{

        const response =
            await fetch(
                "/api/auth/register/send-otp",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    credentials:"include",

                    body:
                        JSON.stringify({
                            name:currentName,
                            email:currentEmail
                        })

                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Unable to resend OTP."
            );

        }


        showMessage(
            "A new verification OTP has been sent.",
            "success"
        );


        document
            .getElementById("otp")
            .value = "";


        document
            .getElementById("otp")
            .focus();


        startTimer();


    }catch(error){

        console.error(
            "REGISTER RESEND ERROR:",
            error
        );


        showMessage(
            error.message ||
            "Unable to resend OTP.",
            "error"
        );


        button.disabled = false;

    }

}


/*
====================================================
CHANGE EMAIL
====================================================
*/

function changeEmail(){

    clearInterval(timer);


    currentName = "";

    currentEmail = "";


    document
        .getElementById("otp")
        .value = "";


    document
        .getElementById(
            "otpSection"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "registrationSection"
        )
        .style.display =
        "block";


    document
        .getElementById("step2")
        .classList.remove(
            "active"
        );


    document
        .getElementById("step1")
        .classList.add(
            "active"
        );


    document
        .getElementById("timer")
        .innerText =
        "";


    document
        .getElementById("resendButton")
        .disabled =
        true;


    document
        .getElementById("email")
        .focus();

}


/*
====================================================
30 SECOND TIMER
====================================================
*/

function startTimer(){

    let seconds = 30;


    const button =
        document.getElementById(
            "resendButton"
        );


    const timerText =
        document.getElementById(
            "timer"
        );


    clearInterval(timer);


    button.disabled = true;


    timerText.innerText =
        ` (${seconds}s)`;


    timer =
        setInterval(
            function(){

                seconds--;


                timerText.innerText =
                    ` (${seconds}s)`;


                if(seconds <= 0){

                    clearInterval(timer);


                    button.disabled =
                        false;


                    timerText.innerText =
                        "";

                }

            },
            1000
        );

}

</script>

</body>

</html>
